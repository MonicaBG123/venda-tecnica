<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

#vt-root, #vt-root * { box-sizing: border-box; }
#vt-root {
  --ink:#1B2A41; --ink-2:#516176; --paper:#FFFEFA; --paper-2:#F2ECDB;
  --mustard:#E2AC1F; --mustard-dark:#A87A0C; --teal:#2F8F82; --rust:#C1502E; --sage:#3F8452;
  --line: rgba(27,42,65,.13);
  --shadow: rgba(31,49,74,.12);
  font-family:'IBM Plex Sans',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 480px at 12% -8%, rgba(226,172,31,.16), transparent 58%),
    radial-gradient(900px 520px at 100% 0%, rgba(47,143,130,.16), transparent 55%),
    #EEF5F0;
  min-height:100vh;
  padding: 28px 14px 60px;
  position:relative;
}
#vt-root h1,#vt-root h2,#vt-root h3{ font-family:'Roboto Slab',serif; margin:0; }
#vt-root p{ margin:0; }
#vt-root button{ font-family:inherit; cursor:pointer; border:none; }
#vt-root input{ font-family:inherit; }
#vt-root :focus-visible{ outline:3px solid var(--mustard); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ #vt-root *{ animation:none !important; transition:none !important; } }

.vt-toastroot{ position:fixed; top:14px; right:14px; z-index:999; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.vt-toast{ background:var(--ink); color:var(--paper); font-family:'Roboto Slab',serif; font-weight:600; padding:10px 16px; border-radius:5px; border:1px solid var(--mustard); box-shadow:0 10px 24px rgba(27,42,65,.28); animation: vtIn .25s ease-out, vtOut .4s ease-in 1.4s forwards; }
@keyframes vtIn{ from{ transform:translateY(-8px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
@keyframes vtOut{ to{ transform:translateY(-8px); opacity:0;} }

/* ---------- Login screen ---------- */
.vt-loginwrap{ max-width:440px; margin:6vh auto; }
.vt-loginwrap .vt-kicker{ color:var(--mustard-dark); font-size:13px; letter-spacing:.02em; margin-bottom:6px; font-weight:600; }
.vt-loginwrap h1{ color:var(--ink); font-size:30px; line-height:1.15; margin-bottom:6px; }
.vt-loginwrap .vt-sub{ color:var(--ink-2); font-size:15px; margin-bottom:22px; }
.vt-card{ background:var(--paper); border-radius:6px; padding:26px 24px; box-shadow:0 18px 38px var(--shadow); position:relative; border:1px solid rgba(27,42,65,.06); }
.vt-ladder{ display:flex; align-items:center; gap:6px; overflow-x:auto; margin:16px 0 24px; padding-bottom:4px; }
.vt-ladder-item{ flex:0 0 auto; font-size:11.5px; font-weight:600; color:var(--ink-2); border:1px solid var(--line); padding:5px 11px; border-radius:20px; white-space:nowrap; background:rgba(255,255,255,.5); }
.vt-ladder-item.vt-start{ color:var(--ink); background:var(--mustard); border-color:var(--mustard); }
.vt-ladder-arrow{ color:rgba(27,42,65,.3); font-size:13px; flex:0 0 auto; }
.vt-ladder-light .vt-ladder-item{ color:var(--ink-2); border-color:var(--line); }
.vt-ladder-light .vt-ladder-arrow{ color:var(--line); }
.vt-stamp{ position:absolute; top:-16px; right:20px; background:var(--paper); border:2px dashed var(--rust); color:var(--rust); font-weight:700; font-size:11px; padding:6px 12px; border-radius:4px; transform:rotate(6deg); box-shadow:0 6px 14px var(--shadow); }
.vt-field{ margin-bottom:16px; }
.vt-field label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; color:var(--ink-2); }
.vt-field input{ width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:4px; font-size:15px; background:#fff; }
.vt-field input:focus{ border-color:var(--teal); }
.vt-error{ background:rgba(193,80,46,.1); border:1px solid var(--rust); color:#8a3820; padding:9px 11px; border-radius:4px; font-size:13.5px; margin-bottom:14px; }
.vt-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:12px 18px; border-radius:4px; font-weight:600; font-size:14.5px; transition:transform .12s ease, filter .12s ease; }
.vt-btn:hover{ filter:brightness(1.06); }
.vt-btn:active{ transform:translateY(1px); }
.vt-btn-primary{ background:var(--mustard); color:var(--ink); width:100%; }
.vt-btn-ghost{ background:transparent; color:var(--teal); border:1.5px solid var(--teal); }
.vt-switchline{ text-align:center; margin-top:16px; font-size:13.5px; color:var(--ink-2); }
.vt-switchline button{ background:none; color:var(--teal); font-weight:600; text-decoration:underline; }
.vt-teacherlink{ display:block; text-align:center; margin-top:22px; color:var(--ink-2); font-size:12.5px; background:none; }
.vt-teacherlink:hover{ color:var(--mustard-dark); }

/* ---------- App chrome (logged in) ---------- */
.vt-shell{ max-width:960px; margin:0 auto; }
.vt-topbar{ background:var(--paper); border-radius:6px; padding:18px 20px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between; box-shadow:0 14px 32px var(--shadow); }
.vt-idblock{ display:flex; align-items:center; gap:14px; }
.vt-avatar{ width:52px; height:52px; border-radius:4px; background:var(--ink); color:var(--paper); display:flex; align-items:center; justify-content:center; font-family:'Roboto Slab',serif; font-weight:700; font-size:19px; flex-shrink:0; }
.vt-idtext .vt-name{ font-family:'Roboto Slab',serif; font-weight:700; font-size:17px; }
.vt-idtext .vt-meta{ font-size:12.5px; color:var(--ink-2); margin-top:2px; }
.vt-idtext .vt-empno{ font-variant-numeric: tabular-nums; letter-spacing:.03em; }
.vt-paybox{ text-align:right; }
.vt-paybox .vt-paylabel{ font-size:11.5px; color:var(--ink-2); text-transform:none; }
.vt-paybox .vt-payfig{ font-family:'Roboto Slab',serif; font-weight:700; font-size:26px; color:var(--teal); }
.vt-level{ display:inline-block; margin-top:2px; font-size:12px; font-weight:600; background:var(--mustard); color:var(--ink); padding:2px 9px; border-radius:3px; }

.vt-progresswrap{ max-width:960px; margin:10px auto 0; background:var(--paper); border-radius:6px; padding:10px 20px 14px; box-shadow:0 8px 20px var(--shadow); }
.vt-progresstop{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-2); margin-bottom:6px; }
.vt-track{ height:8px; background:var(--paper-2); border-radius:5px; overflow:hidden; }
.vt-fill{ height:100%; background:linear-gradient(90deg,var(--teal),var(--mustard)); transition:width .5s ease; }

.vt-nav{ display:flex; gap:8px; overflow-x:auto; margin:16px auto 0; max-width:960px; padding-bottom:2px; }
.vt-navbtn{ flex:0 0 auto; background:var(--paper-2); color:var(--ink-2); padding:9px 15px; border-radius:5px 5px 0 0; font-weight:600; font-size:13.5px; border-bottom:3px solid transparent; }
.vt-navbtn.active{ background:var(--paper); color:var(--ink); border-bottom:3px solid var(--mustard); }

.vt-content{ background:var(--paper); border-radius:0 6px 6px 6px; padding:24px; margin-top:0; box-shadow:0 14px 32px var(--shadow); min-height:340px; }

/* dashboard task cards */
.vt-taskgrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:6px; }
@media (max-width:640px){ .vt-taskgrid{ grid-template-columns:1fr; } }
.vt-task{ background:#fff; border:1px solid var(--line); border-left:5px solid var(--mustard); border-radius:4px; padding:16px 16px 14px; text-align:left; display:flex; flex-direction:column; gap:6px; }
.vt-task.vt-c-teal{ border-left-color:var(--teal); }
.vt-task.vt-c-sage{ border-left-color:var(--sage); }
.vt-task.vt-c-rust{ border-left-color:var(--rust); }
.vt-task h3{ font-size:16.5px; }
.vt-task p{ font-size:13px; color:var(--ink-2); }
.vt-task .vt-taskstatus{ font-size:12.5px; font-weight:600; margin-top:auto; padding-top:6px; }
.vt-task .vt-go{ align-self:flex-start; margin-top:8px; background:var(--ink); color:var(--paper); padding:8px 14px; border-radius:4px; font-size:13px; font-weight:600; }

/* quiz / cases */
.vt-qhead{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
.vt-qhead .vt-qcount{ font-size:12.5px; color:var(--ink-2); font-weight:600; }
.vt-qtext{ font-size:17.5px; line-height:1.5; margin-bottom:16px; font-weight:600; background:rgba(226,172,31,.16); border-left:5px solid var(--mustard); border-radius:6px; padding:16px 18px; color:var(--ink); }
.vt-optsbox{ background:rgba(47,143,130,.07); border-radius:6px; padding:14px; margin-bottom:6px; }
.vt-opts{ display:flex; flex-direction:column; gap:10px; }
.vt-videolink{ display:inline-flex; align-items:center; gap:8px; background:#3D6FA8; color:#fff; padding:12px 18px; border-radius:6px; font-weight:700; font-size:14px; text-decoration:none; }
.vt-videolink:hover{ filter:brightness(1.08); }

/* memory game */
.vt-mem-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:8px; margin-bottom:6px; }
.vt-mem-card{ min-height:78px; background:var(--ink); color:transparent; border:none; border-radius:6px; padding:8px; font-size:12px; line-height:1.35; text-align:center; display:flex; align-items:center; justify-content:center; }
.vt-mem-card:not(:disabled):hover{ filter:brightness(1.15); }
.vt-mem-card.vt-flipped{ background:#fff; color:var(--ink); border:1.5px solid var(--teal); }
.vt-mem-card.vt-matched{ background:rgba(63,132,82,.14); color:var(--ink); border:1.5px solid var(--sage); }

/* offer builder */
.vt-offer-sel{ border-color:var(--teal) !important; background:rgba(47,143,130,.1) !important; }
.vt-opt.vt-missed{ border-color:var(--mustard) !important; background:rgba(226,172,31,.14) !important; }

/* badges */
.vt-badgegrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; }
.vt-badge{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:14px; text-align:center; opacity:.5; }
.vt-badge.vt-badge-unlocked{ opacity:1; border-color:var(--mustard); background:rgba(226,172,31,.08); }
.vt-badge-icon{ font-size:28px; margin-bottom:6px; }
.vt-badge-title{ font-weight:700; font-size:13.5px; margin-bottom:4px; }
.vt-badge-desc{ font-size:11.5px; color:var(--ink-2); line-height:1.4; margin-bottom:6px; }
.vt-badge-status{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-2); }
.vt-badge.vt-badge-unlocked .vt-badge-status{ color:var(--mustard-dark); }

/* roulette */
.vt-wheel{ width:130px; height:130px; border-radius:50%; margin:14px auto 0; border:4px solid var(--ink);
  background:conic-gradient(var(--mustard) 0deg 60deg, var(--teal) 60deg 120deg, var(--sage) 120deg 180deg, var(--rust) 180deg 240deg, #7B5CA6 240deg 300deg, #3D6FA8 300deg 360deg); }
.vt-wheel-spinning{ animation: vtWheelSpin 1.1s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes vtWheelSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(1080deg); } }
.vt-opt{ text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:5px; padding:12px 14px; font-size:14.5px; }
.vt-opt:hover:not(:disabled){ border-color:var(--teal); }
.vt-opt.vt-correct{ border-color:var(--sage); background:rgba(63,110,72,.1); font-weight:600; }
.vt-opt.vt-wrong{ border-color:var(--rust); background:rgba(193,80,46,.1); }
.vt-opt:disabled{ cursor:default; opacity:.85; }
.vt-feedback{ margin-top:16px; padding:12px 14px; border-radius:5px; font-size:13.5px; background:var(--paper-2); }
.vt-feedback.vt-good{ border-left:4px solid var(--sage); }
.vt-feedback.vt-bad{ border-left:4px solid var(--rust); }
.vt-rowend{ margin-top:18px; display:flex; justify-content:space-between; align-items:center; }

/* wordsearch */
.vt-ws-wrap{ display:flex; gap:22px; flex-wrap:wrap; }
.vt-ws-grid{ display:grid; gap:3px; user-select:none; }
.vt-ws-cell{ width:26px; height:26px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid var(--line); font-size:12.5px; font-weight:600; border-radius:2px; color:var(--ink-2); }
.vt-ws-cell.vt-sel{ background:var(--mustard); color:var(--ink); }
.vt-ws-cell.vt-found{ background:var(--sage); color:#fff; }
.vt-ws-list{ list-style:none; padding:0; margin:0; min-width:160px; font-size:14px; }
.vt-ws-list li{ padding:5px 0; border-bottom:1px dashed var(--line); color:var(--ink-2); }
.vt-ws-list li.vt-found{ color:var(--sage); text-decoration:line-through; font-weight:600; }

/* speed round */
.vt-speed-intro{ text-align:center; padding:20px 0; }
.vt-timer{ font-family:'Roboto Slab',serif; font-size:38px; font-weight:700; color:var(--rust); text-align:center; }
.vt-tfstatement{ font-size:19px; text-align:center; margin:22px 0 26px; font-weight:500; line-height:1.4; min-height:70px; display:flex; align-items:center; justify-content:center; }
.vt-tfrow{ display:flex; gap:14px; justify-content:center; }
.vt-tfbtn{ padding:14px 30px; border-radius:5px; font-size:16px; font-weight:700; color:#fff; }
.vt-tfbtn.vt-true{ background:var(--sage); }
.vt-tfbtn.vt-false{ background:var(--rust); }
.vt-scoreline{ text-align:center; margin-top:14px; font-size:13.5px; color:var(--ink-2); }

/* nomina */
.vt-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
.vt-table th{ text-align:left; font-size:12px; color:var(--ink-2); border-bottom:2px solid var(--ink); padding:6px 8px; }
.vt-table td{ padding:8px; border-bottom:1px solid var(--line); }
.vt-table td.vt-amt{ text-align:right; font-weight:600; color:var(--teal); white-space:nowrap; }
.vt-total{ display:flex; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:2px solid var(--ink); font-family:'Roboto Slab',serif; font-weight:700; font-size:17px; }

/* teacher */
.vt-teacher-note{ background:rgba(214,164,25,.15); border:1px solid var(--mustard); border-radius:5px; padding:10px 13px; font-size:13px; margin-bottom:16px; }

/* RA picker */
.vt-ragrid{ display:flex; flex-direction:column; gap:12px; margin-top:8px; }
.vt-racard{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:17px; display:flex; flex-direction:column; gap:7px; }
.vt-racard.vt-ralocked{ opacity:.65; }
.vt-ranum{ display:inline-flex; width:32px; height:32px; align-items:center; justify-content:center; background:var(--ink); color:var(--paper); font-family:'Roboto Slab',serif; font-weight:700; border-radius:4px; font-size:13px; }
.vt-ratitle{ font-size:16px; font-weight:700; font-family:'Roboto Slab',serif; }
.vt-radesc{ font-size:13px; color:var(--ink-2); line-height:1.5; }
.vt-rafoot{ margin-top:auto; padding-top:8px; display:flex; align-items:center; justify-content:space-between; }
.vt-rabtn{ background:var(--mustard); color:var(--ink); padding:8px 16px; border-radius:4px; font-weight:700; font-size:13px; }
.vt-rasoon{ font-size:11.5px; font-weight:600; color:var(--ink-2); background:var(--paper-2); padding:4px 10px; border-radius:20px; }

/* RA breadcrumb + subnav */
.vt-crumb{ margin-bottom:10px; }
.vt-rabanner{ font-size:13px; color:var(--ink-2); margin-bottom:10px; }
.vt-rabanner strong{ color:var(--ink); }

/* RA hub roadmap */
.vt-roadmap{ position:relative; padding-left:38px; margin-top:16px; }
.vt-roadmap::before{ content:''; position:absolute; left:15px; top:8px; bottom:8px; width:2px; background:var(--line); }
.vt-roadstep{ position:relative; background:#fff; border:1px solid var(--line); border-left-width:5px; border-left-style:solid; border-radius:6px; padding:14px 16px; margin-bottom:14px; }
.vt-roadstep::before{ content:attr(data-num); position:absolute; left:-38px; top:16px; width:30px; height:30px; border-radius:50%; background:var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; font-family:'Roboto Slab',serif; }
.vt-roadstep.vt-roaddone::before{ content:'✓'; background:var(--sage); }
.vt-roadhead{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
.vt-roadhead h3{ font-size:16px; }
.vt-roadstatus{ font-size:12px; font-weight:600; white-space:nowrap; }
.vt-roaddesc{ font-size:13px; color:var(--ink-2); margin:5px 0 10px; }

/* teacher roster chips */
.vt-namechip{ display:inline-block; background:var(--paper-2); border:1px solid var(--line); padding:5px 13px; border-radius:20px; font-size:13px; font-weight:600; color:var(--ink); }
.vt-namechip:hover{ background:var(--mustard); border-color:var(--mustard); }
.vt-rowlink{ background:none; color:var(--teal); font-weight:600; font-size:13.5px; text-decoration:underline; }
.vt-peekbanner{ background:var(--ink); color:#fff; padding:10px 16px; border-radius:6px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:12px; font-size:13.5px; }
.vt-peekbanner button{ background:var(--mustard); color:var(--ink); padding:6px 13px; border-radius:4px; font-weight:700; font-size:12.5px; white-space:nowrap; }

/* teacher messaging */
.vt-msgbtn{ background:var(--paper-2); border:1px solid var(--line); color:var(--ink); padding:5px 11px; border-radius:4px; font-size:12.5px; font-weight:600; white-space:nowrap; }
.vt-msgbtn:hover{ background:var(--mustard); border-color:var(--mustard); }
.vt-msgtextarea{ width:100%; padding:12px; border:1.5px solid var(--line); border-radius:5px; font-size:14px; font-family:inherit; resize:vertical; }

/* student-facing messages */
.vt-msgcard{ background:rgba(123,92,166,.10); border-left:5px solid #7B5CA6; border-radius:6px; padding:14px 16px; margin-bottom:12px; }
.vt-msgcard .vt-msgtext{ font-size:14.5px; line-height:1.5; margin-bottom:8px; }
.vt-msgfoot{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--ink-2); }
.vt-msgfoot button{ background:#7B5CA6; color:#fff; padding:5px 12px; border-radius:4px; font-weight:600; font-size:12px; }
.vt-msgrow{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:12px 14px; border-bottom:1px solid var(--line); }
.vt-msgrow:last-child{ border-bottom:none; }
.vt-msgbadge{ display:inline-block; background:#7B5CA6; color:#fff; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }
.vt-summarycard{ background:#fff; border:1px solid var(--line); border-radius:5px; padding:16px; margin-bottom:16px; }

/* payslip */
.vt-payhead{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; background:var(--paper-2); border:1px solid var(--line); border-radius:6px; padding:15px 18px; margin-bottom:18px; }
.vt-payhead .vt-ph-block strong{ display:block; font-family:'Roboto Slab',serif; font-size:14.5px; color:var(--ink); margin-bottom:5px; }
.vt-payhead .vt-ph-block div{ font-size:12.5px; color:var(--ink-2); line-height:1.6; }
.vt-paysection{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-2); margin:18px 0 8px; }
.vt-deductrow{ display:flex; justify-content:space-between; padding:8px 2px; border-top:1px dashed var(--line); font-size:13.5px; color:var(--ink-2); }
.vt-liquid{ display:flex; justify-content:space-between; align-items:baseline; margin-top:4px; padding:14px 16px; background:var(--ink); border-radius:6px; }
.vt-liquid span:first-child{ color:rgba(255,255,255,.75); font-size:13px; font-weight:600; }
.vt-liquid span:last-child{ color:#fff; font-family:'Roboto Slab',serif; font-weight:700; font-size:21px; }

.vt-empty{ text-align:center; padding:40px 10px; color:var(--ink-2); }
.vt-topline{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.vt-backlink{ background:none; color:var(--teal); font-weight:600; font-size:13.5px; }

/* teoria accordion */
.vt-bloc-title{ font-size:13px; font-weight:600; color:var(--teal); margin:22px 0 8px; }
.vt-bloc-title:first-child{ margin-top:0; }
.vt-accitem{ border:1px solid var(--line); border-radius:4px; margin-bottom:8px; overflow:hidden; }
.vt-acchead{ width:100%; text-align:left; background:#fff; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:14px; }
.vt-acchead:hover{ background:var(--paper-2); }
.vt-accmark{ color:var(--mustard-dark); font-size:13px; }
.vt-accbody{ padding:4px 14px 14px; font-size:13.5px; line-height:1.6; color:var(--ink-2); background:#fff; }
.vt-accbody p{ margin-bottom:8px; }
.vt-accbody p:last-child{ margin-bottom:0; }

/* activitats */
.vt-actcard{ border:1px solid var(--line); border-left:5px solid var(--teal); border-radius:4px; margin-bottom:10px; background:#fff; overflow:hidden; }
.vt-acthead{ width:100%; text-align:left; padding:14px 16px; display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.vt-acthead:hover{ background:var(--paper-2); }
.vt-actnum{ display:inline-block; background:var(--ink); color:var(--paper); font-family:'Roboto Slab',serif; font-weight:700; font-size:12px; padding:2px 8px; border-radius:3px; margin-bottom:6px; }

      {t:"10. Els tres tipus d'atributs", p:"Atributs intrínsecs: el que el producte és per dins (composició, qualitat, disseny). Atributs externs: el que es veu des de fora (envàs, embalatge, etiqueta). Atributs intangibles: el que no es toca però dona valor afegit (marca, garantia, servei)."},

      {t:"13. Atributs intangibles I: la marca i el 'made in'", p:"La marca és un símbol distintiu que diferencia el producte de la competència i actua com a indicador de confiança. El lloc de fabricació ('made in') té un impacte significatiu en la percepció de qualitat, ja que els clients associen certs països amb estàndards concrets."},

  function ra1Progress(st){
    var totalTasks = QUIZ.length + CASES.length + 1;
    var doneTasks = st.quiz.correctIds.length + st.cases.correctIds.length + (st.wordsearch.done ? 1 : 0);
    return Math.min(100, Math.round((doneTasks/totalTasks)*100));
  }

  function levelInfo(st){
    var count = completedRACount(st);
    var idx = Math.min(count, LEVELS.length-1);
    var current = LEVELS[idx];
    var next = LEVELS[idx+1] || null;
    var nextRA = next ? RAS[idx] : null;
    var pct = 100;
    if(next){
      pct = (nextRA && nextRA.id==='ra1') ? ra1Progress(st) : 0;
    }
    return {title:current.title, next:next, pct:pct, nextRA:nextRA};
  }

  function renderLadder(opts){

  function euro(n){ return n + " €"; }

  function hexToRgba(hex, alpha){
    hex = hex.replace('#','');
    var r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
    return 'rgba('+r+','+g+','+b+','+alpha+')';
  }

  function idealTextColor(hex){
    hex = hex.replace('#','');
    var r = parseInt(hex.substring(0,2),16), g = parseInt(hex.substring(2,4),16), b = parseInt(hex.substring(4,6),16);
    var lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.6 ? '#1B2A41' : '#FFFFFF';
  }

  function slugify(name){
    return (name||"").trim().toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  }

  function employeeNumber(slug){
    var h = 0;
    for(var i=0;i<slug.length;i++){ h = (h*31 + slug.charCodeAt(i)) % 99999; }
    return String(h).padStart(5,"0");
  }

  function initials(name){
    var parts = (name||"").trim().split(/\s+/).filter(Boolean);
    if(parts.length===0) return "??";
    if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0]+parts[1][0]).toUpperCase();
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  function mergeCloudMessages(data, msgs){
    var added = false;
    var have = {};
    data.messages.forEach(function(m){ if(m.id) have[String(m.id)] = true; });
    (msgs||[]).forEach(function(m){
      if(!have[String(m.id)]){ data.messages.unshift({id:String(m.id), date:m.date, text:m.text, read:false}); added = true; }
    });
    return added;
  }

  /* ---------------- word search build ---------------- */
  function buildWordSearch(){
    var size = WS_SIZE;
    var grid = [];
    for(var r=0;r<size;r++){ grid.push(new Array(size).fill(null)); }
    var dirs = [[0,1],[1,0],[1,1],[1,-1]];
    var placements = [];
    var words = shuffle(WS_WORDS);
    words.forEach(function(w){
      var letters = w.grid.split("");
      var placed = false;
      for(var attempt=0; attempt<300 && !placed; attempt++){
        var dir = dirs[Math.floor(Math.random()*dirs.length)];
        var row = Math.floor(Math.random()*size);
        var col = Math.floor(Math.random()*size);
        var endRow = row + dir[0]*(letters.length-1);
        var endCol = col + dir[1]*(letters.length-1);
        if(endRow<0||endRow>=size||endCol<0||endCol>=size) continue;
        var ok = true;
        for(var i=0;i<letters.length;i++){
          var rr=row+dir[0]*i, cc=col+dir[1]*i;
          if(grid[rr][cc] && grid[rr][cc]!==letters[i]){ ok=false; break; }
        }
        if(!ok) continue;
        for(var j=0;j<letters.length;j++){
          var r2=row+dir[0]*j, c2=col+dir[1]*j;
          grid[r2][c2]=letters[j];
        }
        placements.push({word:w.grid,label:w.label,row:row,col:col,dir:dir,len:letters.length});
        placed = true;
      }
    });
    var ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for(var r3=0;r3<size;r3++){
      for(var c3=0;c3<size;c3++){
        if(!grid[r3][c3]) grid[r3][c3] = ABC[Math.floor(Math.random()*ABC.length)];
      }
    }
    return {grid:grid, placements:placements, found:[], selStart:null, startTime:Date.now()};
  }

  function pathCells(start, end){
    var dr = end.row-start.row, dc = end.col-start.col;
    var steps = Math.max(Math.abs(dr), Math.abs(dc));
    if(steps===0) return null;
    var stepR = dr/steps, stepC = dc/steps;
    if(Math.abs(stepR)>1 || Math.abs(stepC)>1) return null;
    if(!(Number.isInteger(dr/steps) && Number.isInteger(dc/steps))) return null;
    var cells = [];
    for(var i=0;i<=steps;i++){ cells.push({row:start.row+stepR*i, col:start.col+stepC*i}); }
    return cells;
  }

  function renderWordsearch(){
    if(!S.wsGame){ S.wsGame = buildWordSearch(); }
    var g = S.wsGame;
    var foundWords = g.found.map(function(f){ return f.word; });
    var gridHtml = '<div class="vt-ws-grid" style="grid-template-columns:repeat('+WS_SIZE+',26px);">';
    for(var r=0;r<WS_SIZE;r++){
      for(var c=0;c<WS_SIZE;c++){
        var cls = 'vt-ws-cell';
        var inFound = g.found.some(function(f){
          return f.cells.some(function(cell){ return cell.row===r && cell.col===c; });
        });
        if(inFound) cls += ' vt-found';
        else if(g.selStart && g.selStart.row===r && g.selStart.col===c) cls += ' vt-sel';
        gridHtml += '<div class="'+cls+'" data-action="ws-cell" data-row="'+r+'" data-col="'+c+'">'+g.grid[r][c]+'</div>';
      }
    }
    gridHtml += '</div>';
    var listHtml = '<ul class="vt-ws-list">' + WS_WORDS.map(function(w){
      return '<li class="'+(foundWords.indexOf(w.grid)!==-1?'vt-found':'')+'">'+esc(w.label)+'</li>';
    }).join("") + '</ul>';
    var allDone = g.found.length === WS_WORDS.length;
    return ''
    + '<div class="vt-qhead"><h2>Sopa de lletres</h2><span class="vt-qcount">'+g.found.length+'/'+WS_WORDS.length+' trobades</span></div>'
    + '<p style="font-size:13.5px;color:var(--ink-2);margin-bottom:14px;">Toca la primera lletra d\'una paraula i després l\'última, en línia recta (horitzontal, vertical o diagonal).</p>'

  /* ---------------- Aparella conceptes (memory) ---------------- */
  function buildMemoryGame(){
    var cards = [];
    MEMORY_PAIRS.forEach(function(p, i){
      cards.push({pairId:i, type:'term', text:p.term});
      cards.push({pairId:i, type:'def', text:p.def});
    });
    cards = shuffle(cards);
    return {cards:cards, flipped:[], matched:[], busy:false};
  }

  function renderMemory(){
    if(!S.memoryGame) S.memoryGame = buildMemoryGame();
    var g = S.memoryGame;
    var allDone = g.matched.length === MEMORY_PAIRS.length;
    var cardsHtml = g.cards.map(function(c, idx){
      var isMatched = g.matched.indexOf(c.pairId) !== -1;
      var isFlipped = g.flipped.indexOf(idx) !== -1;
      var cls = 'vt-mem-card' + (isMatched ? ' vt-matched' : (isFlipped ? ' vt-flipped' : ''));
      var shown = (isMatched || isFlipped) ? esc(c.text) : '?';
      return '<button class="'+cls+'" data-action="memory-cell" data-idx="'+idx+'" '+((isMatched||g.busy)?'disabled':'')+'>'+shown+'</button>';
    }).join("");
    return ''
    + '<div class="vt-qhead"><h2>Aparella conceptes</h2><span class="vt-qcount">'+g.matched.length+'/'+MEMORY_PAIRS.length+' parelles</span></div>'
    + '<p style="font-size:13.5px;color:var(--ink-2);margin-bottom:14px;">Toca dues cartes: si un concepte i la seva definició coincideixen, es queden descobertes.</p>'
    + '<div class="vt-mem-grid">'+cardsHtml+'</div>'
    + (allDone ? '<div class="vt-feedback vt-good" style="margin-top:16px;">Molt bé, les has aparellat totes!</div>' : '')
    + '<div class="vt-rowend"><button class="vt-backlink" data-action="go-rahub">Tornar al resum</button>'
      + '<button class="vt-btn vt-btn-ghost" data-action="memory-restart">Nova partida</button></div>';
  }

  /* ---------------- Construeix la teva oferta ---------------- */
  function renderOffer(){
    var st = S.student;
    if(S.offerGame.index >= OFFER_SCENARIOS.length){
      return '<div class="vt-empty"><h3 style="margin-bottom:10px;">Has atès tots els clients!</h3>'
        + '<p style="margin-bottom:16px;">Pots repassar-ho tantes vegades com vulguis.</p>'

    }
    var sc = OFFER_SCENARIOS[S.offerGame.index];
    var checked = S.offerGame.checked || false;
    var sel = S.offerGame.selected || {};
    var cardsHtml = sc.cards.map(function(c, i){

      return '<button class="'+cls+'" data-action="offer-toggle" data-idx="'+i+'" '+(checked?'disabled':'')+'>'+esc(c.label)+'</button>';

      return '<div class="vt-roadstep'+(s.done?' vt-roaddone':'')+'" data-num="'+(s.done?'✓':'🔒')+'" style="border-left-color:'+(s.done?'var(--sage)':'var(--line)')+';">'

  }

  function renderRoulette(){
    var st = S.student;
    var g = S.rouletteGame;
    var alreadySpunToday = st.roulette.lastDate === todayStr();
    var wheelCls = 'vt-wheel' + (g.spinning ? ' vt-wheel-spinning' : '');

      return '<div class="vt-speed-intro"><h2 style="margin-bottom:10px;">Ruleta diària</h2>'
        + '<div class="'+wheelCls+'"></div>'
        + '<p style="color:var(--ink-2);margin:16px 0;">Ja has girat la ruleta avui. Torna demà per a una nova oportunitat!</p>'
        + '<button class="vt-backlink" data-action="go-dashboard">Tornar al despatx</button></div>';
    }
    if(g.spinning){
      return '<div class="vt-speed-intro"><h2 style="margin-bottom:10px;">Ruleta diària</h2>'
        + '<div class="'+wheelCls+'"></div>'
        + '<p style="color:var(--ink-2);margin-top:16px;">Girant...</p></div>';
    }
    if(g.question && !g.answered){
      return '<div class="vt-speed-intro"><h2 style="margin-bottom:10px;">Ruleta diària</h2>'

        + '<div class="vt-feedback '+(g.wasCorrect?'vt-good':'vt-bad')+'" style="margin-top:16px;">'+(g.wasCorrect ? ("Encertat! Has guanyat "+euro(g.won)+".") : "Aquesta vegada no, però torna demà per una nova ronda.")+'</div>'
        + '<div style="margin-top:14px;"><button class="vt-backlink" data-action="go-dashboard">Tornar al despatx</button></div></div>';
    }
    return '<div class="vt-speed-intro"><h2 style="margin-bottom:10px;">Ruleta diària</h2>'
      + '<p style="color:var(--ink-2);margin-bottom:18px;">Un gir al dia, una pregunta ràpida i un petit bonus si l\'encertes.</p>'
      + '<div class="'+wheelCls+'"></div>'
      + '<button class="vt-btn vt-btn-primary" style="margin-top:20px;" data-action="roulette-spin">Girar la ruleta</button>'
      + '<div style="margin-top:14px;"><button class="vt-backlink" data-action="go-dashboard">Tornar al despatx</button></div></div>';
  }

  /* ---------------- actions ---------------- */
  function stopSpeedTimer(){
    if(S.speedGame && S.speedGame.intervalId){ clearInterval(S.speedGame.intervalId); S.speedGame.intervalId=null; }
  }
  function stopClassifyTimer(){
    if(S.classifyGame && S.classifyGame.intervalId){ clearInterval(S.classifyGame.intervalId); S.classifyGame.intervalId=null; }
  }

  function goto(view){
    if(view!=='speed') stopSpeedTimer();
    if(view!=='classify') stopClassifyTimer();
    S.view = view;
    if(view==='dashboard' || view==='nomina' || view==='messages' || view==='badges' || view==='roulette'){ S.currentRA = null; }
    if(view==='quiz'){ S.quiz = {index:0, answered:false, selected:null}; }
    if(view==='cases'){ S.cases = {index:0, answered:false, selected:null}; }
    if(view==='video'){ S.pictoQuiz = {index:0, answered:false, selected:null}; }
    if(view==='wordsearch'){ S.wsGame = null; }
    if(view==='speed'){ S.speedGame = {phase:'idle', timeLeft:30, order:[], idx:0, correct:0, wrong:0, intervalId:null}; }
    if(view==='memory'){ S.memoryGame = null; }
    if(view==='classify'){ S.classifyGame = {phase:'idle', timeLeft:30, order:[], idx:0, correct:0, wrong:0, intervalId:null}; }
    if(view==='offer'){ S.offerGame = {index:0, selected:{}}; }
    if(view==='roulette'){ S.rouletteGame = {spinning:false, question:null, answered:false}; }
    render();
  }

  function handleAction(action, btn){
    if(action==='toggle-register'){ S.registerMode = !S.registerMode; S.loginError=''; render(); return; }
    if(action==='go-teacher-login'){ S.view='teacherLogin'; S.teacherError=''; render(); return; }
    if(action==='go-login'){ S.view='login'; render(); return; }

    if(action==='login'){
      var name = document.getElementById('vtName').value.trim();
      var pin = document.getElementById('vtPin').value.trim();
      if(!name || !pin){ S.loginError='Omple el nom i el PIN.'; render(); return; }
      var slug = slugify(name);
      var localLogin = function(offline){
        var entry = S.registry.students[slug];
        if(!entry){ S.loginError = offline ? 'No hi ha connexió amb el servidor. Torna-ho a provar.' : 'No existeix cap compte amb aquest nom. Crea\'n un de nou.'; render(); return; }
        if(entry.pin !== pin){ S.loginError='PIN incorrecte.'; render(); return; }
        S.slug = slug;
        loadStudent(slug).then(function(data){
          S.student = normalizeStudent(data) || newStudentData(entry.name);
          S.loginError=''; goto('dashboard');
        });
      };
      if(!cloudOn()){ localLogin(false); return; }
      toast('Entrant...');
      cloudCall({action:'get', slug:slug, pin:pin}).then(function(res){
        if(!res){ localLogin(true); return; }
        if(!res.ok){ S.loginError = (res.error==='pin') ? 'PIN incorrecte.' : 'No existeix cap compte amb aquest nom. Crea\'n un de nou.'; render(); return; }
        var cdata = normalizeStudent(res.data) || newStudentData(res.name);
        var added = mergeCloudMessages(cdata, res.messages);
        S.registry.students[slug] = {name:res.name, pin:pin}; saveRegistry(S.registry);
        S.slug = slug; S.student = cdata;
        if(added){ saveStudent(slug, cdata); }
        else { try { localStorage.setItem("student:"+slug, JSON.stringify(cdata)); } catch(e){} }
        S.loginError=''; goto('dashboard');
      });
      return;
    }

    if(action==='register'){
      var rname = document.getElementById('vtName').value.trim();
      var rpin = document.getElementById('vtPin').value.trim();
      var rpin2 = document.getElementById('vtPin2').value.trim();
      if(!rname || !rpin){ S.loginError='Omple el nom i el PIN.'; render(); return; }
      if(!/^[0-9]{4}$/.test(rpin)){ S.loginError='El PIN ha de tenir 4 xifres.'; render(); return; }
      if(rpin!==rpin2){ S.loginError='Els PIN no coincideixen.'; render(); return; }
      var rslug = slugify(rname);
      if(!rslug){ S.loginError='Escriu un nom vàlid.'; render(); return; }
      var newData = newStudentData(rname);
      var finishRegister = function(){
        S.registry.students[rslug] = {name:rname, pin:rpin};
        saveRegistry(S.registry);
        S.slug = rslug; S.student = newData;
        try { localStorage.setItem("student:"+rslug, JSON.stringify(newData)); } catch(e){}
        S.loginError=''; S.registerMode=false;
        goto('dashboard');
      };
      if(cloudOn()){
        toast('Creant el compte...');
        cloudCall({action:'register', slug:rslug, name:rname, pin:rpin, summary:summaryOf(newData), data:dataForCloud(newData)}).then(function(res){
          if(!res){ S.loginError='No hi ha connexió amb el servidor. Torna-ho a provar.'; render(); return; }
          if(!res.ok){ S.loginError='Aquest nom ja té un compte. Inicia sessió.'; render(); return; }
          finishRegister();
        });
        return;
      }
      if(S.registry.students[rslug]){ S.loginError='Aquest nom ja té un compte. Inicia sessió.'; render(); return; }
      finishRegister();
      saveStudent(rslug, newData);
      return;
    }

    if(action==='teacher-login' || action==='teacher-refresh'){
      var code = (action==='teacher-refresh') ? S.teacherCode : document.getElementById('vtTeacherCode').value.trim();
      if(cloudOn()){
        toast('Carregant la classe...');
        cloudCall({action:'roster', code:code}).then(function(res){
          if(!res){ S.teacherError='No hi ha connexió amb el servidor.'; if(S.view!=='teacher'){ render(); } else { toast('No hi ha connexió amb el servidor.'); } return; }
          if(!res.ok){ S.teacherError='Codi incorrecte.'; render(); return; }
          S.teacherCode = code;
          S.cloudStudents = {};
          S.teacherRoster = res.students.map(function(sx){
            var d = normalizeStudent(sx.data) || newStudentData(sx.name);
            S.cloudStudents[sx.slug] = d;
            return rosterEntry(sx.slug, d);
          });
          S.teacherError = '';
          S.view='teacher'; render();
        });
        return;
      }
      if(code !== TEACHER_CODE){ S.teacherError='Codi incorrecte.'; render(); return; }
      var slugs = Object.keys(S.registry.students);
      Promise.all(slugs.map(function(sl){
        return loadStudent(sl).then(function(d){
          var data = normalizeStudent(d) || newStudentData(S.registry.students[sl].name);
          return rosterEntry(sl, data);
        });
      })).then(function(roster){
        S.teacherRoster = roster; S.view='teacher'; render();
      });
      return;
    }

    if(action==='teacher-peek'){
      stopSpeedTimer(); stopClassifyTimer();
      var peekSlug = btn.getAttribute('data-slug');
      var registryEntry = S.registry.students[peekSlug];
      var openPeek = function(data){
        S.slug = peekSlug;
        S.student = normalizeStudent(data) || newStudentData(registryEntry ? registryEntry.name : peekSlug);
        S.teacherPeekMode = true;
        S.currentRA = null;
        S.view = 'dashboard';
        render();
      };
      if(S.cloudStudents && S.cloudStudents[peekSlug]){ openPeek(JSON.parse(JSON.stringify(S.cloudStudents[peekSlug]))); }
      else { loadStudent(peekSlug).then(openPeek); }
      return;
    }
    if(action==='teacher-peek-exit'){
      stopSpeedTimer(); stopClassifyTimer();
      S.teacherPeekMode = false;
      S.slug = null;
      S.student = null;
      S.currentRA = null;
      S.view = 'teacher';
      render();
      return;
    }

    if(action==='teacher-message'){
      S.teacherComposeTarget = {slug: btn.getAttribute('data-slug'), name: btn.getAttribute('data-name')};
      S.view = 'teacherCompose';
      render();
      return;
    }
    if(action==='teacher-message-cancel'){
      S.teacherComposeTarget = null;
      S.view = 'teacher';
      render();
      return;
    }
    if(action==='msg-template'){
      var ta = document.getElementById('vtMsgText');
      if(ta){ ta.value = btn.getAttribute('data-text'); }
      return;
    }
    if(action==='teacher-message-send'){
      var msgText = document.getElementById('vtMsgText').value.trim();
      if(!msgText){ toast('Escriu un missatge abans d\'enviar-lo'); return; }
      var target = S.teacherComposeTarget;
      if(!target) return;
      var when = new Date().toLocaleString('ca-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      var msgId = String(Date.now());
      var msgDone = function(){
        toast('Missatge enviat a '+target.name);
        S.teacherComposeTarget = null;
        S.view = 'teacher';
        render();
      };
      if(cloudOn()){
        cloudCall({action:'message', code:S.teacherCode, slug:target.slug, id:msgId, date:when, text:msgText}).then(function(res){
          if(!res || !res.ok){ toast('No s\'ha pogut enviar el missatge. Torna-ho a provar.'); return; }
          msgDone();
        });
        return;
      }
      loadStudent(target.slug).then(function(data){
        data = normalizeStudent(data) || newStudentData(target.name);
        data.messages.unshift({id:msgId, date:when, text:msgText, read:false});
        return saveStudent(target.slug, data);
      }).then(msgDone);
      return;
    }

    if(action==='logout'){ stopSpeedTimer(); stopClassifyTimer(); S.slug=null; S.student=null; S.view='login'; S.currentRA=null; S.teacherPeekMode=false; render(); return; }
    if(action==='go-dashboard'){ goto('dashboard'); return; }
    if(action==='open-ra'){
      var raId = btn.getAttribute('data-id');
      var raObj = raById(raId);
      if(!raObj || !raObj.active) return;
      S.currentRA = raId;
      goto('rahub');
      return;
    }
    if(action==='go-rahub'){ goto('rahub'); return; }
    if(action==='go-teoria'){ goto('teoria'); return; }
    if(action==='go-quiz'){ goto('quiz'); return; }
    if(action==='go-cases'){ goto('cases'); return; }
    if(action==='go-wordsearch'){ goto('wordsearch'); return; }
    if(action==='go-speed'){ goto('speed'); return; }
    if(action==='go-video'){ goto('video'); return; }
    if(action==='go-memory'){ goto('memory'); return; }
    if(action==='go-classify'){ goto('classify'); return; }
    if(action==='go-offer'){ goto('offer'); return; }
    if(action==='go-escape'){ goto('escape'); return; }
    if(action==='go-badges'){ goto('badges'); return; }
    if(action==='go-roulette'){ goto('roulette'); return; }
    if(action==='go-nomina'){ goto('nomina'); return; }
    if(action==='go-messages'){ goto('messages'); return; }
    if(action==='msg-read'){
      var midx = parseInt(btn.getAttribute('data-idx'),10);
      if(S.student.messages[midx]){ S.student.messages[midx].read = true; persistStudent(); }
      render();
      return;
    }

    if(action==='teoria-toggle'){
      var tid = btn.getAttribute('data-id');
      if(!S.teoriaOpen) S.teoriaOpen = {};
      S.teoriaOpen[tid] = !S.teoriaOpen[tid];
      render(); return;
    }
    if(action==='act-toggle'){
      var aid = btn.getAttribute('data-id');
      if(!S.actOpen) S.actOpen = {};
      S.actOpen[aid] = !S.actOpen[aid];
      render(); return;
    }

    if(action==='quiz-answer'){
      var qi = parseInt(btn.getAttribute('data-idx'),10);
      S.quiz.answered = true; S.quiz.selected = qi;
      var q = QUIZ[S.quiz.index];
      var qOk = (qi===q.correct);
      recordStreak(qOk);
      if(qOk && S.student.quiz.correctIds.indexOf(S.quiz.index)===-1){
        S.student.quiz.correctIds.push(S.quiz.index);
        pay(15, "Test ràpid: pregunta "+(S.quiz.index+1)+" encertada");
      } else { persistStudent(); }
      render(); return;
    }
    if(action==='quiz-next'){ S.quiz.index++; S.quiz.answered=false; S.quiz.selected=null; render(); return; }
    if(action==='quiz-restart'){ S.quiz = {index:0, answered:false, selected:null}; render(); return; }

    if(action==='case-answer'){
      var ci = parseInt(btn.getAttribute('data-idx'),10);
      S.cases.answered = true; S.cases.selected = ci;
      var c = CASES[S.cases.index];
      var cOk = (ci===c.correct);
      recordStreak(cOk);
      if(cOk && S.student.cases.correctIds.indexOf(S.cases.index)===-1){
        S.student.cases.correctIds.push(S.cases.index);
        pay(25, "Cas pràctic "+(S.cases.index+1)+" resolt correctament");
      } else { persistStudent(); }
      render(); return;
    }
    if(action==='case-next'){ S.cases.index++; S.cases.answered=false; S.cases.selected=null; render(); return; }
    if(action==='cases-restart'){ S.cases = {index:0, answered:false, selected:null}; render(); return; }

    if(action==='picto-answer'){
      var pi = parseInt(btn.getAttribute('data-idx'),10);
      S.pictoQuiz.answered = true; S.pictoQuiz.selected = pi;
      var pq = PICTO_QUIZ[S.pictoQuiz.index];
      var pOk = (pi===pq.correct);
      recordStreak(pOk);
      if(pOk && S.student.pictoQuiz.correctIds.indexOf(S.pictoQuiz.index)===-1){
        S.student.pictoQuiz.correctIds.push(S.pictoQuiz.index);
        pay(20, "Vídeo pictogrames: pregunta "+(S.pictoQuiz.index+1)+" encertada");
      } else { persistStudent(); }
      render(); return;
    }
    if(action==='picto-next'){ S.pictoQuiz.index++; S.pictoQuiz.answered=false; S.pictoQuiz.selected=null; render(); return; }
    if(action==='picto-restart'){ S.pictoQuiz = {index:0, answered:false, selected:null}; render(); return; }

    if(action==='ws-restart'){ S.wsGame = buildWordSearch(); render(); return; }
    if(action==='ws-cell'){
      var row = parseInt(btn.getAttribute('data-row'),10);
      var col = parseInt(btn.getAttribute('data-col'),10);
      var g = S.wsGame;
      if(!g.selStart){ g.selStart = {row:row,col:col}; render(); return; }
      var cells = pathCells(g.selStart, {row:row,col:col});
      if(cells){
        var letters = cells.map(function(c){ return g.grid[c.row][c.col]; }).join("");
        var rev = letters.split("").reverse().join("");
        var match = g.placements.find(function(p){
          return (p.word===letters || p.word===rev) && !g.found.some(function(f){ return f.word===p.word; });
        });
        if(match){ g.found.push({word:match.word, cells:cells}); }
      }
      g.selStart = null;
      if(g.found.length===WS_WORDS.length){
        if(!S.student.wordsearch.done){
          S.student.wordsearch.done = true;
          pay(100, "Sopa de lletres completada");
        }
        if(!S.student.wordsearch.fastDone && (Date.now()-g.startTime) <= 60000){
          S.student.wordsearch.fastDone = true;
          pay(30, "Sopa de lletres en menys d'un minut");
        }
      }
      render(); return;
    }

    if(action==='speed-start'){
      stopSpeedTimer();
      S.speedGame = {phase:'running', timeLeft:30, order:shuffle(TF), idx:0, correct:0, wrong:0, intervalId:null};
      S.speedGame.intervalId = setInterval(function(){
        S.speedGame.timeLeft--;
        if(S.speedGame.timeLeft<=0){
          stopSpeedTimer();
          S.speedGame.phase='done';
          if(S.speedGame.correct > S.student.speed.best){
            S.student.speed.best = S.speedGame.correct;
            persistStudent();
          }
        }
        render();
      }, 1000);
      render(); return;
    }
    if(action==='speed-answer'){
      var g2 = S.speedGame;
      if(!g2 || g2.phase!=='running') return;
      var val = btn.getAttribute('data-val')==='true';
      var item = g2.order[g2.idx % g2.order.length];
      var speedOk = (val===item.a);
      recordStreak(speedOk);
      if(speedOk){ g2.correct++; pay(8, "Repte contra rellotge: resposta correcta"); }
      else { g2.wrong++; persistStudent(); }
      g2.idx++;
      render(); return;
    }

    /* ---- Aparella conceptes (memory) ---- */
    if(action==='memory-restart'){ S.memoryGame = buildMemoryGame(); render(); return; }
    if(action==='memory-cell'){
      var g3 = S.memoryGame;
      if(!g3 || g3.busy) return;
      var midx2 = parseInt(btn.getAttribute('data-idx'),10);
      if(g3.flipped.indexOf(midx2)!==-1) return;
      if(g3.matched.indexOf(g3.cards[midx2].pairId)!==-1) return;
      g3.flipped.push(midx2);
      if(g3.flipped.length===2){
        var a = g3.cards[g3.flipped[0]], b = g3.cards[g3.flipped[1]];
        if(a.pairId===b.pairId && a.type!==b.type){
          g3.matched.push(a.pairId);
          g3.flipped = [];
          if(g3.matched.length===MEMORY_PAIRS.length && !S.student.memory.done){
            S.student.memory.done = true;
            pay(80, "Aparella conceptes completat");
          }
        } else {
          g3.busy = true;
          setTimeout(function(){ g3.flipped=[]; g3.busy=false; render(); }, 900);
        }
      }
      render(); return;
    }

    /* ---- Classifica contra rellotge ---- */
    if(action==='classify-start'){
      stopClassifyTimer();
      S.classifyGame = {phase:'running', timeLeft:30, order:shuffle(CLASSIFY), idx:0, correct:0, wrong:0, intervalId:null};
      S.classifyGame.intervalId = setInterval(function(){
        S.classifyGame.timeLeft--;
        if(S.classifyGame.timeLeft<=0){
          stopClassifyTimer();
          S.classifyGame.phase='done';
          if(S.classifyGame.correct > S.student.classify.best){
            S.student.classify.best = S.classifyGame.correct;
            persistStudent();
          }
        }
        render();
      }, 1000);
      render(); return;
    }
    if(action==='classify-answer'){
      var g4 = S.classifyGame;
      if(!g4 || g4.phase!=='running') return;
      var cidx = parseInt(btn.getAttribute('data-idx'),10);
      var citem = g4.order[g4.idx % g4.order.length];
      var classifyOk = (cidx===citem.correct);
      recordStreak(classifyOk);
      if(classifyOk){ g4.correct++; pay(10, "Classifica contra rellotge: resposta correcta"); }
      else { g4.wrong++; persistStudent(); }
      g4.idx++;
      render(); return;
    }

    /* ---- Construeix la teva oferta ---- */
    if(action==='offer-restart'){ S.offerGame = {index:0, selected:{}}; render(); return; }
    if(action==='offer-toggle'){
      if(S.offerGame.checked) return;
      var oidx = parseInt(btn.getAttribute('data-idx'),10);
      if(!S.offerGame.selected) S.offerGame.selected = {};
      S.offerGame.selected[oidx] = !S.offerGame.selected[oidx];
      render(); return;
    }
    if(action==='offer-check'){
      var sc = OFFER_SCENARIOS[S.offerGame.index];
      var sel = S.offerGame.selected || {};
      var hits = 0, misses = 0;
      sc.cards.forEach(function(c, i){
        var isSel = !!sel[i];
        if(c.fit && isSel) hits++;
        if(!c.fit && isSel) misses++;
      });
      var net = Math.max(0, hits-misses);
      S.offerGame.checked = true;
      if(net>0 && S.student.offerGame.doneScenarios.indexOf(S.offerGame.index)===-1){
        S.student.offerGame.doneScenarios.push(S.offerGame.index);
        pay(net*15, "Oferta per al client "+(S.offerGame.index+1)+": "+hits+" encerts");
      } else {
        persistStudent();
      }
      render(); return;
    }
    if(action==='offer-next'){ S.offerGame.index++; S.offerGame.selected={}; S.offerGame.checked=false; render(); return; }

    /* ---- Escape room ---- */
    if(action==='escape-claim'){
      var stE = S.student;
      var allDone = (stE.quiz.correctIds.length===QUIZ.length) && (stE.cases.correctIds.length===CASES.length)
        && stE.wordsearch.done && (stE.pictoQuiz.correctIds.length===PICTO_QUIZ.length) && stE.memory.done;
      if(allDone && !stE.escapeClaimed){
        stE.escapeClaimed = true;
        pay(150, "Recompensa final de l'escape room de RA1");
      }
      render(); return;
    }

    /* ---- Ruleta diària ---- */
    if(action==='roulette-spin'){
      if(S.student.roulette.lastDate === todayStr()) return;
      S.rouletteGame = {spinning:true, question:null, answered:false};
      render();
      setTimeout(function(){
        S.rouletteGame.spinning = false;
        S.rouletteGame.question = shuffle(TF)[0];
        render();
      }, 1150);
      return;
    }
    if(action==='roulette-answer'){
      var g5 = S.rouletteGame;
      if(!g5 || !g5.question || g5.answered) return;
      var rval = btn.getAttribute('data-val')==='true';
      var rOk = (rval===g5.question.a);
      recordStreak(rOk);
      S.student.roulette.lastDate = todayStr();
      g5.answered = true;
      g5.wasCorrect = rOk;
      if(rOk){
        g5.won = Math.floor(Math.random()*16)+10;
        pay(g5.won, "Ruleta diària: resposta correcta");
      } else {
        persistStudent();
      }
      render(); return;
    }
  }

  document.getElementById('vtApp').addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    handleAction(btn.getAttribute('data-action'), btn);
  });

  loadRegistry().then(function(reg){
    S.registry = reg;
    S.view = 'login';
    render();
  });
})();
</script>
